<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transfer your music playlists between Spotify and YouTube Music seamlessly. Never lose your favorite songs when switching music services." />
    <title>PenguinShift - Transfer Playlists Between Music Platforms</title>
    
    <!-- Security Headers -->
    <!-- Content Security Policy: Prevents XSS attacks by controlling resource loading -->
    <!-- Note: X-Frame-Options, X-Content-Type-Options must be set via HTTP headers, not meta tags -->
    <!-- Content Security Policy - More permissive for local development -->
    <!-- Note: For local network access, we use a permissive policy. In production, set stricter CSP via HTTP headers. -->
    <!-- CSP doesn't support wildcard IP ranges, so we allow all HTTP connections for local development -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' http: ws: wss:; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' http: https://challenges.cloudflare.com https://*.cloudflare.com https://cdn.lgrckt-in.com https://*.lgrckt-in.com; 
                   worker-src 'self' blob:; 
                   style-src 'self' 'unsafe-inline' http: https://fonts.googleapis.com; 
                   font-src 'self' http: https://fonts.gstatic.com data:; 
                   img-src 'self' data: https: blob: http:; 
                   connect-src 'self' http: ws: wss: https://api.penguinshift.com https://*.railway.app https://*.onrender.com https://*.cloudflare.com wss://*.cloudflare.com https://cdn.lgrckt-in.com https://*.lgrckt-in.com; 
                   frame-src 'self' https://challenges.cloudflare.com https://*.cloudflare.com; 
                   object-src 'none'; 
                   base-uri 'self'; 
                   form-action 'self';" />
    
    <!-- X-Content-Type-Options: Prevents MIME type sniffing (works in meta tag) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Referrer Policy: Controls referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Note: X-Frame-Options must be set via HTTP header in production, not meta tag -->
    
    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Preconnect to Cloudflare Turnstile for faster CAPTCHA loading -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
